name: t2_rental
description: "Offline-first construction material rental records."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.0.0
  go_router: ^16.2.0
  intl: ^0.20.2
  image_picker: ^1.2.4
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  archive: ^4.5.2
  cryptography: ^2.9.0
  share_plus: ^13.3.1
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.28.1
  flutter_lints: ^6.0.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
